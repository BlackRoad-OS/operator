# Vendor API configuration — canonical source of truth
#
# Declares all external AI/API vendor endpoints used by the operator.
# Each vendor entry supports an endpoint_override that routes through
# your own infrastructure (e.g., a self-hosted proxy or Cloudflare Worker).
#
# Priority: environment variable > endpoint_override > default_endpoint
#
# To disable a vendor entirely, set enabled: false.

vendors:
  # -----------------------------------------------------------------------
  # GitHub — primary platform integration
  # -----------------------------------------------------------------------
  - name: github
    enabled: true
    default_endpoint: https://api.github.com
    # Optional: set VENDOR_GITHUB_ENDPOINT in env to override.
    endpoint_env_var: VENDOR_GITHUB_ENDPOINT

  # -----------------------------------------------------------------------
  # Cloudflare — DNS, tunnels, and Workers
  # -----------------------------------------------------------------------
  - name: cloudflare
    enabled: true
    default_endpoint: https://api.cloudflare.com/client/v4
    endpoint_env_var: VENDOR_CLOUDFLARE_ENDPOINT

  # -----------------------------------------------------------------------
  # OpenAI-compatible — any provider that speaks the OpenAI REST API.
  # Point endpoint_override at a self-hosted model server (e.g., Ollama,
  # llama.cpp, vLLM) or a Cloudflare AI Gateway to avoid direct vendor calls.
  # -----------------------------------------------------------------------
  - name: openai_compatible
    enabled: false
    default_endpoint: https://api.openai.com/v1
    # Set VENDOR_OPENAI_ENDPOINT to your self-hosted or proxied endpoint:
    #   http://localhost:11434/v1            (Ollama)
    #   https://gateway.ai.cloudflare.com/… (Cloudflare AI Gateway)
    endpoint_env_var: VENDOR_OPENAI_ENDPOINT

  # -----------------------------------------------------------------------
  # Anthropic-compatible — same override pattern as above.
  # -----------------------------------------------------------------------
  - name: anthropic_compatible
    enabled: false
    default_endpoint: https://api.anthropic.com/v1
    endpoint_env_var: VENDOR_ANTHROPIC_ENDPOINT

  # -----------------------------------------------------------------------
  # Tailscale — network fabric API
  # -----------------------------------------------------------------------
  - name: tailscale
    enabled: true
    default_endpoint: https://api.tailscale.com/api/v2
    endpoint_env_var: VENDOR_TAILSCALE_ENDPOINT

# Routing policy applied to all vendors.
routing:
  # When true, only vendors whose endpoint resolves to the operator's own
  # network (Tailscale CGNAT range 100.x.x.x or a declared subnet) are used.
  # Set to false to allow direct internet calls from the operator process.
  prefer_local: false

  # Outbound proxy for all vendor requests (optional).
  # Supports http://, https://, and socks5:// schemes.
  # Set via environment variable OPERATOR_HTTP_PROXY.
  http_proxy_env_var: OPERATOR_HTTP_PROXY
