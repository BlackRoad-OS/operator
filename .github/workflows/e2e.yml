name: E2E Scraper Pipeline

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]
  schedule:
    # Run every 6 hours to keep data fresh
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  test-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run unit tests
        run: npm run test:unit

  test-e2e:
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run E2E pipeline tests
        run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 5
      - name: Upload scraped data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-data
          path: data/
          retention-days: 30

  scrape-and-verify:
    runs-on: ubuntu-latest
    needs: test-e2e
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run full scrape
        run: node src/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify data integrity
        run: node src/verify.js
      - name: Commit fresh data
        run: |
          git config user.name "BlackRoad Operator"
          git config user.email "operator@blackroad.io"
          git add data/
          git diff --cached --quiet || git commit -m "data: update scraped metrics [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push
