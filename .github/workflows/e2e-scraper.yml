name: E2E Scraper Pipeline

on:
  schedule:
    # Run every 6 hours for real-time updates
    - cron: "0 */6 * * *"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "package.json"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run scrape

      - name: Verify scraped data
        run: npm run verify

      - name: Generate report
        run: npm run report

      - name: Run E2E tests
        run: npm test
        continue-on-error: false

      - name: Upload scrape artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-data-${{ github.run_number }}
          path: data/
          retention-days: 30

      - name: Commit verified metrics (main only)
        if: github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name "BlackRoad Operator Bot"
          git config user.email "operator@blackroad.io"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: update verified metrics [skip ci]"
            git push
          fi

  failure-recovery:
    needs: scrape-and-test
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Retry scraper with backoff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "First attempt failed. Retrying with backoff..."
          for i in 1 2 3; do
            echo "Retry attempt $i..."
            if npm run scrape 2>/dev/null; then
              echo "Scraper succeeded on retry $i"
              npm run verify
              npm run report
              exit 0
            fi
            SLEEP=$((2 ** i))
            echo "Sleeping ${SLEEP}s before next retry..."
            sleep $SLEEP
          done
          echo "All retries exhausted"
          exit 1

      - name: Upload recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-data-${{ github.run_number }}
          path: data/
          retention-days: 30
