name: infra-audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  infra-audit:
    name: infra-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run audit
        run: node audit/runner.js

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: |
            audit/output-public.json
            audit/output-private.json
          if-no-files-found: ignore
