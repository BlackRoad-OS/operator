name: Audit

on:
  push:
    branches: ["main", "copilot/**"]
  pull_request:
    branches: ["main"]

jobs:
  audit:
    name: Run audit runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run audit runner
        run: node audit/runner.js

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-outputs
          path: |
            audit/output-private.json
            audit/output-public.json
