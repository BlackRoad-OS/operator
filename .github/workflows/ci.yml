name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate repository structure
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate config JSON files
        run: |
          for f in config/blackroad.json config/targets.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              && echo "OK: $f" \
              || { echo "INVALID: $f"; exit 1; }
          done

      - name: Validate e2e.config.js exports
        run: node -e "import('./e2e.config.js').then(m => { if(!m.TARGETS?.length) throw new Error('No TARGETS'); console.log('e2e.config.js: OK —', m.TARGETS.length, 'targets'); })"

      - name: Check required files exist
        run: |
          for f in \
            e2e.config.js \
            config/blackroad.json \
            config/targets.json \
            audit/runner.js \
            audit/checks/dns.js \
            audit/checks/github.js \
            audit/checks/https.js \
            audit/checks/ssl.js \
            src/scraper/index.js \
            src/scraper/config.js \
            src/scraper/fetch.js \
            src/metrics/verify.js \
            src/metrics/report.js \
            scripts/e2e.js; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Check JavaScript syntax
        run: |
          for f in \
            audit/runner.js \
            audit/checks/dns.js \
            audit/checks/github.js \
            audit/checks/https.js \
            audit/checks/ssl.js \
            scripts/e2e.js; do
            node --check "$f" && echo "Syntax OK: $f"
          done

      - name: Verify package.json scripts defined
        run: |
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf8'));
            const required = ['scrape','verify','report','test','e2e','ci'];
            const missing = required.filter(s => !pkg.scripts?.[s]);
            if (missing.length) { console.error('Missing scripts:', missing); process.exit(1); }
            console.log('All required scripts present:', required.join(', '));
          "

  python-check:
    name: Validate Python structure
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile scraper/config.py && echo "Syntax OK: scraper/config.py"

      - name: Validate pyproject.toml
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml','rb')); print('pyproject.toml: valid')"

      - name: Verify pytest discovers tests
        run: |
          pip install -r requirements.txt
          pytest --collect-only tests/ e2e/ 2>&1 | tail -5
